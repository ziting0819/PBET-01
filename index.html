<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日系繪本風 - 相片記帳與分帳本</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js 圖表庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts 霞鶩文楷 (LXGW WenKai TC) -->
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"LXGW WenKai TC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'LXGW WenKai TC', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .storybook-card {
            border: 2px dashed rgba(0, 0, 0, 0.08);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="transition-colors duration-300 min-h-screen pb-24" id="bodyBg">

    <!-- 頂部導覽列 -->
    <header class="shadow-xs sticky top-0 z-30 transition-colors duration-300 backdrop-blur-md bg-white/70" id="headerBg">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="w-9 h-9 rounded-2xl flex items-center justify-center text-white shadow-xs" id="logoIcon"><i class="fa-solid fa-book-open"></i></span>
                <select id="viewSelect" onchange="switchView(this.value)" class="font-bold text-base bg-transparent border-none focus:outline-none cursor-pointer text-gray-700">
                    <option value="overview">帳務總覽</option>
                    <option value="records">交易明細</option>
                    <option value="photos">相片展示櫃</option>
                    <option value="split">多人分帳</option>
                    <option value="charts">圖表分析</option>
                    <option value="settings">匯率設定</option>
                </select>
            </div>
            <div class="flex items-center space-x-1 bg-white/80 px-2 py-1 rounded-xl border border-black/5 shadow-2xs">
                <label for="themeSelect" class="text-xs font-medium text-gray-500 mr-1"><i class="fa-solid fa-palette"></i></label>
                <select id="themeSelect" onchange="changeTheme(this.value)" class="text-xs bg-transparent focus:outline-none cursor-pointer text-gray-700 font-medium">
                    <option value="monet">莫內畫作</option>
                    <option value="feather">羽毛暮光</option>
                    <option value="wood">復古木紋</option>
                    <option value="rose">玫瑰花園</option>
                    <option value="spring">春日花卉</option>
                    <option value="oil">油畫肌理</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4 space-y-4">
        
        <!-- 月份選擇卡片 -->
        <section class="rounded-3xl p-4 storybook-card text-gray-700 transition-all duration-300" id="cardBg">
            <div class="flex justify-between items-center">
                <button onclick="changeMonth(-1)" class="w-9 h-9 rounded-2xl bg-white/80 hover:bg-white flex items-center justify-center transition shadow-2xs text-gray-600"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                <span id="currentMonthLabel" class="font-bold text-base tracking-wider">2026年 11月</span>
                <button onclick="changeMonth(1)" class="w-9 h-9 rounded-2xl bg-white/80 hover:bg-white flex items-center justify-center transition shadow-2xs text-gray-600"><i class="fa-solid fa-chevron-right text-xs"></i></button>
            </div>
        </section>

        <!-- 頁面 1: 帳務總覽 -->
        <div id="viewOverview" class="view-section space-y-4">
            <div class="bg-white/90 rounded-3xl p-5 storybook-card space-y-3">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">本月收支概況</h3>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-emerald-50/50 p-2.5 rounded-2xl">
                        <div class="text-xs text-gray-400 mb-1">總收入</div>
                        <div id="overviewIncome" class="font-bold text-base text-emerald-600">$0</div>
                    </div>
                    <div class="bg-rose-50/50 p-2.5 rounded-2xl">
                        <div class="text-xs text-gray-400 mb-1">總支出</div>
                        <div id="overviewExpense" class="font-bold text-base text-rose-600">$0</div>
                    </div>
                    <div class="bg-gray-50/80 p-2.5 rounded-2xl">
                        <div class="text-xs text-gray-400 mb-1">結餘</div>
                        <div id="overviewBalance" class="font-bold text-base">$0</div>
                    </div>
                </div>
            </div>

            <div class="space-y-2">
                <div class="flex justify-between items-center px-1">
                    <h2 class="text-xs font-bold text-gray-500 tracking-wider">近期紀錄</h2>
                    <button onclick="switchView('records')" class="text-xs text-gray-500 hover:text-gray-800 font-medium">查看全部 <i class="fa-solid fa-arrow-right"></i></button>
                </div>
                <div id="recentList" class="space-y-2.5"></div>
            </div>
        </div>

        <!-- 頁面 2: 交易明細 -->
        <div id="viewRecords" class="view-section hidden space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-xs font-bold text-gray-500 tracking-wider">所有交易明細</h2>
                <div class="text-xs text-gray-400" id="recordCount">共 0 筆</div>
            </div>
            <div id="fullList" class="space-y-2.5"></div>
        </div>

        <!-- 頁面 3: 相片展示櫃 (含 全部 / 支出 / 收入 分類) -->
        <div id="viewPhotos" class="view-section hidden space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-xs font-bold text-gray-500 tracking-wider">相片展示櫃</h2>
                <div class="flex space-x-1 bg-white/80 p-1 rounded-xl border border-black/5 text-xs">
                    <button onclick="filterPhotoCategory('all')" id="photoBtnAll" class="px-3 py-1 rounded-lg font-bold transition shadow-2xs bg-emerald-500 text-white">全部</button>
                    <button onclick="filterPhotoCategory('expense')" id="photoBtnExpense" class="px-3 py-1 rounded-lg font-medium transition text-gray-600">支出</button>
                    <button onclick="filterPhotoCategory('income')" id="photoBtnIncome" class="px-3 py-1 rounded-lg font-medium transition text-gray-600">收入</button>
                </div>
            </div>
            <div id="photoGrid" class="grid grid-cols-3 gap-2.5"></div>
            <div id="noPhotosMsg" class="hidden text-center py-12 bg-white/60 rounded-3xl storybook-card text-xs text-gray-400">
                目前沒有符合條件的照片或收據喔！
            </div>
        </div>

        <!-- 頁面 4: 多人分帳 -->
        <div id="viewSplit" class="view-section hidden space-y-4">
            <div class="bg-white/90 rounded-3xl p-5 storybook-card space-y-4">
                <div class="flex justify-between items-center border-b pb-3">
                    <h3 class="font-bold text-gray-800 text-base"><i class="fa-solid fa-users-rectangle mr-1 text-blue-500"></i> 多人分帳算錢小幫手</h3>
                    <button onclick="openSplitModal()" class="text-xs px-3 py-1.5 rounded-xl text-white font-bold shadow-xs transition" id="splitAddBtn"><i class="fa-solid fa-plus mr-1"></i> 新增分帳</button>
                </div>
                
                <!-- 成員結算總覽 -->
                <div class="space-y-2">
                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">成員結算清單</h4>
                    <div id="splitSummaryList" class="space-y-2"></div>
                </div>

                <!-- 分帳紀錄列表 -->
                <div class="space-y-2 pt-2 border-t">
                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">分帳明細紀錄</h4>
                    <div id="splitItemList" class="space-y-2"></div>
                </div>
            </div>
        </div>

        <!-- 頁面 5: 圖表分析 -->
        <div id="viewCharts" class="view-section hidden space-y-4">
            <div class="bg-white/90 rounded-3xl p-5 storybook-card space-y-3">
                <h3 class="text-xs font-bold text-gray-500 tracking-wider">本月支出分類統計</h3>
                <div class="relative h-64 flex items-center justify-center">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 頁面 6: 匯率設定 -->
        <div id="viewSettings" class="view-section hidden space-y-4">
            <div class="bg-white/90 rounded-3xl p-5 storybook-card space-y-4">
                <div class="flex justify-between items-center border-b pb-3">
                    <h3 class="font-bold text-gray-800 text-base"><i class="fa-solid fa-coins mr-1 text-amber-500"></i> 自訂外幣匯率設定</h3>
                    <button onclick="resetExchangeRates()" class="text-xs text-gray-400 hover:text-gray-600 underline">恢復預設</button>
                </div>
                <p class="text-xs text-gray-500">設定 1 單位外幣相當於多少台幣 (TWD)。修改後記帳與分帳時會自動依照此匯率換算。</p>
                
                <div id="rateInputsContainer" class="space-y-3"></div>

                <button onclick="saveCustomRates()" class="w-full py-3 text-white font-bold rounded-2xl text-sm shadow-md transition" id="saveRateBtn">儲存自訂匯率</button>
            </div>
        </div>

    </main>

    <!-- 底部固定新增按鈕 -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-4 bg-gradient-to-t from-white/90 via-white/50 to-transparent z-20 flex justify-center items-center">
        <button onclick="openModal()" id="mainActionBtn" class="w-16 h-16 rounded-3xl shadow-lg flex items-center justify-center text-white text-2xl hover:scale-105 active:scale-95 transition-all">
            <i class="fa-solid fa-plus"></i>
        </button>
    </nav>

    <!-- 新增/編輯 記帳 Modal -->
    <div id="txModal" onclick="checkCloseModal(event, 'txModal')" class="fixed inset-0 bg-black/30 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="font-bold text-lg text-gray-800">新增記帳</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="txForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="txId">

                <div class="grid grid-cols-2 gap-2 p-1 bg-gray-100 rounded-2xl">
                    <button type="button" id="typeExpenseBtn" onclick="switchType('expense')" class="py-2.5 rounded-xl text-sm font-bold transition shadow-xs bg-white text-rose-600">支出</button>
                    <button type="button" id="typeIncomeBtn" onclick="switchType('income')" class="py-2.5 rounded-xl text-sm font-bold transition text-gray-500">收入</button>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1">幣別</label>
                        <select id="txCurrency" onchange="calculateConvertedAmount()" class="w-full px-3 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:outline-none text-sm font-bold">
                            <option value="TWD">TWD 台幣</option>
                            <option value="JPY">JPY 日幣</option>
                            <option value="USD">USD 美元</option>
                            <option value="EUR">EUR 歐元</option>
                            <option value="KRW">KRW 韓元</option>
                            <option value="CNY">CNY 人民幣</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs font-medium text-gray-500 mb-1">金額 (外幣或台幣)</label>
                        <input type="number" step="any" id="txAmount" oninput="calculateConvertedAmount()" required placeholder="0" class="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 text-lg font-bold">
                    </div>
                </div>

                <div id="conversionInfo" class="hidden text-xs bg-emerald-50 text-emerald-700 p-2.5 rounded-xl flex justify-between items-center">
                    <span id="exchangeRateText">匯率換算中...</span>
                    <span id="convertedTwdText" class="font-bold text-sm"></span>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">項目名稱</label>
                    <input type="text" id="txTitle" required placeholder="例如：午餐、日本藥妝..." class="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 text-sm">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-medium text-gray-500">分類</label>
                        <button type="button" onclick="openAddCatModal()" class="text-xs text-blue-500 hover:underline font-medium"><i class="fa-solid fa-plus"></i> 新增分類</button>
                    </div>
                    <div id="categoryContainer" class="grid grid-cols-4 gap-2 max-h-48 overflow-y-auto p-1"></div>
                    <input type="hidden" id="txCategory" required>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">日期</label>
                    <input type="date" id="txDate" required class="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">相片 / 收據</label>
                    <div class="flex items-center space-x-3">
                        <label class="flex-1 cursor-pointer bg-gray-50 hover:bg-gray-100 border border-dashed border-gray-300 rounded-2xl p-3 text-center transition flex items-center justify-center space-x-2 text-gray-600 text-sm">
                            <i class="fa-solid fa-camera"></i>
                            <span id="photoFileName">選擇照片</span>
                            <input type="file" id="txPhoto" accept="image/*" onchange="previewPhoto(this)" class="hidden">
                        </label>
                        <button type="button" id="removePhotoBtn" onclick="clearPhoto()" class="hidden text-rose-500 p-3 hover:bg-rose-50 rounded-2xl"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <div id="photoPreviewContainer" class="mt-2 hidden">
                        <img id="photoPreviewImg" class="w-20 h-20 object-cover rounded-2xl border border-gray-200">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">備註 (選填)</label>
                    <input type="text" id="txNote" placeholder="補充說明..." class="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 text-sm">
                </div>

                <button type="submit" id="submitBtn" class="w-full py-3.5 rounded-2xl text-white font-bold shadow-md transition-all">儲存紀錄</button>
            </form>
        </div>
    </div>

    <!-- 新增/編輯 多人分帳 Modal -->
    <div id="splitModal" onclick="checkCloseModal(event, 'splitModal')" class="fixed inset-0 bg-black/30 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="splitModalTitle" class="font-bold text-lg text-gray-800">新增分帳項目</h3>
                <button onclick="closeSplitModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="splitForm" onsubmit="handleSplitSubmit(event)" class="space-y-4">
                <input type="hidden" id="splitId">

                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">消費項目名稱</label>
                    <input type="text" id="splitTitle" required placeholder="例如：晚餐燒肉、門票..." class="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:outline-none text-sm">
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1">幣別</label>
                        <select id="splitCurrency" onchange="calculateSplitConverted()" class="w-full px-3 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:outline-none text-sm font-bold">
                            <option value="TWD">TWD 台幣</option>
                            <option value="JPY">JPY 日幣</option>
                            <option value="USD">USD 美元</option>
                            <option value="EUR">EUR 歐元</option>
                            <option value="KRW">KRW 韓元</option>
                            <option value="CNY">CNY 人民幣</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs font-medium text-gray-500 mb-1">總金額</label>
                        <input type="number" step="any" id="splitAmount" oninput="calculateSplitConverted()" required placeholder="0" class="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:outline-none text-lg font-bold">
                    </div>
                </div>

                <div id="splitConversionInfo" class="hidden text-xs bg-emerald-50 text-emerald-700 p-2.5 rounded-xl flex justify-between items-center">
                    <span id="splitRateText">匯率換算中...</span>
                    <span id="splitConvertedTwdText" class="font-bold text-sm"></span>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">誰先代墊付錢？</label>
                    <input type="text" id="splitPayer" required placeholder="例如：小明" class="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:outline-none text-sm">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">參與分帳成員 (用逗號隔開)</label>
                    <input type="text" id="splitMembers" required value="小明, 小華, 小美" class="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:outline-none text-sm">
                    <span class="text-[10px] text-gray-400 mt-1 block">例如輸入：小明, 小華, 小美 (會自動平均分攤)</span>
                </div>

                <button type="submit" id="splitSubmitBtn" class="w-full py-3.5 rounded-2xl text-white font-bold shadow-md transition">儲存分帳</button>
            </form>
        </div>
    </div>

    <!-- 自訂新增分類 Modal -->
    <div id="addCatModal" onclick="checkCloseModal(event, 'addCatModal')" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h4 class="font-bold text-gray-800 text-base">新增自訂分類</h4>
                <button onclick="closeAddCatModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form onsubmit="handleAddCategory(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">分類名稱</label>
                    <input type="text" id="newCatName" required placeholder="例如：寵物、醫療..." class="w-full px-4 py-2.5 bg-gray-50 rounded-xl border border-gray-200 focus:outline-none text-sm">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">選擇圖示</label>
                    <div id="iconPicker" class="grid grid-cols-5 gap-2 max-h-36 overflow-y-auto p-1 border border-gray-100 rounded-xl"></div>
                    <input type="hidden" id="selectedIcon" value="fa-tag">
                </div>

                <button type="submit" id="catSubmitBtn" class="w-full py-3 text-white font-bold rounded-xl text-sm shadow-md transition">確定新增</button>
            </form>
        </div>
    </div>

    <!-- 詳細資訊 Modal -->
    <div id="detailModal" onclick="checkCloseModal(event, 'detailModal')" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <div class="flex items-center space-x-2">
                    <span id="detailIcon" class="w-10 h-10 rounded-2xl flex items-center justify-center text-white text-lg"></span>
                    <div>
                        <h4 id="detailTitle" class="font-bold text-gray-800 text-base"></h4>
                        <span id="detailCategory" class="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-600"></span>
                    </div>
                </div>
                <button onclick="closeDetailModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="space-y-2 text-sm">
                <div class="flex justify-between py-1 border-b border-gray-50"><span class="text-gray-400">金額</span><span id="detailAmount" class="font-bold"></span></div>
                <div id="detailForeignRow" class="hidden flex justify-between py-1 border-b border-gray-50"><span class="text-gray-400">外幣原額</span><span id="detailForeignAmount" class="text-gray-700 font-medium"></span></div>
                <div class="flex justify-between py-1 border-b border-gray-50"><span class="text-gray-400">日期</span><span id="detailDate" class="text-gray-700"></span></div>
                <div class="flex justify-between py-1 border-b border-gray-50"><span class="text-gray-400">備註</span><span id="detailNote" class="text-gray-700"></span></div>
            </div>

            <div id="detailPhotoSection" class="hidden">
                <span class="block text-xs font-medium text-gray-400 mb-1">相片/收據 (點擊可看大圖)</span>
                <img id="detailPhotoImg" onclick="openLightbox(this.src)" class="w-full h-40 object-cover rounded-2xl border border-gray-200 cursor-pointer hover:opacity-90 transition shadow-2xs">
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="editCurrentTx()" class="py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-xl text-sm"><i class="fa-solid fa-pen mr-1"></i> 編輯</button>
                <button onclick="deleteCurrentTx()" class="py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium rounded-xl text-sm"><i class="fa-solid fa-trash mr-1"></i> 刪除</button>
            </div>

    </div>

    <!-- 圖片全螢幕檢視 Lightbox -->

        <img id="lightboxImg" class="max-w-full max-h-[90vh] rounded-2xl shadow-2xl object-contain">
    </div>

    <script>
        const defaultExchangeRates = { JPY: 0.21, USD: 32.5, EUR: 35.0, KRW: 0.024, CNY: 4.5 };
        let exchangeRates = JSON.parse(localStorage.getItem('simple_account_rates')) || defaultExchangeRates;

        // 六款主題色彩配置 (按鈕與重點顏色會隨主題動態變化)
        const themes = {
            monet: { bodyBg: 'bg-[#F9FAF8]', headerBg: 'bg-white/80 backdrop-blur-md', logoIcon: 'bg-[#A2B59F]', cardBg: 'bg-gradient-to-br from-[#E8EDE6]/70 to-[#F2EBEB]/70 storybook-card', mainBtn: 'bg-[#A2B59F] hover:bg-[#8e9f8b]' },
            feather: { bodyBg: 'bg-[#F7F8FA]', headerBg: 'bg-white/80 backdrop-blur-md', logoIcon: 'bg-[#838BB2]', cardBg: 'bg-gradient-to-br from-[#E2E6F2]/70 to-[#F5DDD5]/60 storybook-card', mainBtn: 'bg-[#838BB2] hover:bg-[#727a9e]' },
            wood: { bodyBg: 'bg-[#F6F6F4]', headerBg: 'bg-white/80 backdrop-blur-md', logoIcon: 'bg-[#83B1C9]', cardBg: 'bg-gradient-to-br from-[#E5ECEE]/70 to-[#E4EBE1]/70 storybook-card', mainBtn: 'bg-[#83B1C9] hover:bg-[#719cb3]' },
            rose: { bodyBg: 'bg-[#FAF7F6]', headerBg: 'bg-white/80 backdrop-blur-md', logoIcon: 'bg-[#B97687]', cardBg: 'bg-gradient-to-br from-[#F4E8E1]/70 to-[#F1E4E3]/70 storybook-card', mainBtn: 'bg-[#B97687] hover:bg-[#a46777]' },
            spring: { bodyBg: 'bg-[#F5F7F5]', headerBg: 'bg-white/80 backdrop-blur-md', logoIcon: 'bg-[#A8C5B2]', cardBg: 'bg-gradient-to-br from-[#FAF0D9]/60 to-[#F8DCD5]/60 storybook-card', mainBtn: 'bg-[#A8C5B2] hover:bg-[#94b19e]' },
            oil: { bodyBg: 'bg-[#F3F6F6]', headerBg: 'bg-white/80 backdrop-blur-md', logoIcon: 'bg-[#A3B6C5]', cardBg: 'bg-gradient-to-br from-[#E2ECEB]/70 to-[#F2E8E8]/70 storybook-card', mainBtn: 'bg-[#A3B6C5] hover:bg-[#90a2b1]' }
        };

        const defaultCategories = {
            expense: [
                { id: 'food', name: '餐飲', icon: 'fa-utensils', color: 'bg-amber-100 text-amber-600' },
                { id: 'transport', name: '交通', icon: 'fa-bus', color: 'bg-blue-100 text-blue-600' },
                { id: 'shopping', name: '購物', icon: 'fa-bag-shopping', color: 'bg-rose-100 text-rose-600' },
                { id: 'entertainment', name: '娛樂', icon: 'fa-gamepad', color: 'bg-purple-100 text-purple-600' },
                { id: 'bills', name: '帳單', icon: 'fa-file-invoice-dollar', color: 'bg-emerald-100 text-emerald-600' },
                { id: 'other', name: '其他', icon: 'fa-ellipsis', color: 'bg-gray-100 text-gray-600' }
            ],
            income: [
                { id: 'salary', name: '薪水', icon: 'fa-wallet', color: 'bg-emerald-100 text-emerald-600' },
                { id: 'bonus', name: '獎金', icon: 'fa-gift', color: 'bg-amber-100 text-amber-600' },
                { id: 'investment', name: '投資', icon: 'fa-chart-line', color: 'bg-blue-100 text-blue-600' },
                { id: 'parttime', name: '兼職', icon: 'fa-laptop-code', color: 'bg-purple-100 text-purple-600' },
                { id: 'other_inc', name: '其他', icon: 'fa-plus', color: 'bg-gray-100 text-gray-600' }
            ]
        };

        const availableIcons = ['fa-dog', 'fa-cat', 'fa-heart-pulse', 'fa-dumbbell', 'fa-spray-can-sparkles', 'fa-shirt', 'fa-plane', 'fa-book', 'fa-baby', 'fa-car', 'fa-house', 'fa-graduation-cap', 'fa-piggy-bank', 'fa-store', 'fa-utensils'];

        let categories = JSON.parse(localStorage.getItem('simple_account_cats')) || defaultCategories;
        let currentTheme = localStorage.getItem('simple_account_theme') || 'monet';
        let transactions = JSON.parse(localStorage.getItem('simple_account_txs')) || [];
        let splitItems = JSON.parse(localStorage.getItem('simple_account_splits')) || [];
        let currentDate = new Date();
        let currentType = 'expense';
        let currentPhotoBase64 = '';
        let activeDetailId = null;
        let chartInstance = null;
        let currentPhotoFilter = 'all';

        window.onload = function() {
            document.getElementById('themeSelect').value = currentTheme;
            applyTheme(currentTheme);
            setTodayDate();
            renderCategories();
            renderApp();
            renderIconPicker();
            renderRateInputs();
            renderSplitData();
        };

        function checkCloseModal(event, modalId) {
            if (event.target.id === modalId) {
                if (modalId === 'txModal') closeModal();
                else if (modalId === 'addCatModal') closeAddCatModal();
                else if (modalId === 'detailModal') closeDetailModal();
                else if (modalId === 'splitModal') closeSplitModal();
            }
        }

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightboxModal').classList.remove('hidden');
        }
        function closeLightbox() {
            document.getElementById('lightboxModal').classList.add('hidden');
        }

        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            if (viewName === 'overview') document.getElementById('viewOverview').classList.remove('hidden');
            if (viewName === 'records') document.getElementById('viewRecords').classList.remove('hidden');
            if (viewName === 'photos') {
                document.getElementById('viewPhotos').classList.remove('hidden');
                renderPhotoGrid();
            }
            if (viewName === 'split') {
                document.getElementById('viewSplit').classList.remove('hidden');
                renderSplitData();
            }
            if (viewName === 'charts') {
                document.getElementById('viewCharts').classList.remove('hidden');
                renderChart();
            }
            if (viewName === 'settings') {
                document.getElementById('viewSettings').classList.remove('hidden');
                renderRateInputs();
            }
        }

        function changeTheme(name) {
            currentTheme = name;
            localStorage.setItem('simple_account_theme', name);
            applyTheme(name);
        }

        function applyTheme(name) {
            const t = themes[name] || themes.monet;
            document.getElementById('bodyBg').className = `transition-colors duration-300 min-h-screen pb-24 ${t.bodyBg}`;
            document.getElementById('headerBg').className = `shadow-xs sticky top-0 z-30 transition-colors duration-300 backdrop-blur-md ${t.headerBg}`;
            document.getElementById('logoIcon').className = `w-9 h-9 rounded-2xl flex items-center justify-center text-white shadow-xs ${t.logoIcon}`;
            document.getElementById('cardBg').className = `rounded-3xl p-4 text-gray-700 transition-all duration-300 ${t.cardBg}`;
            document.getElementById('mainActionBtn').className = `w-16 h-16 rounded-3xl shadow-lg flex items-center justify-center text-white text-2xl hover:scale-105 active:scale-95 transition-all ${t.mainBtn}`;
            document.getElementById('submitBtn').className = `w-full py-3.5 rounded-2xl text-white font-bold shadow-md transition-all ${t.mainBtn}`;
            document.getElementById('saveRateBtn').className = `w-full py-3 text-white font-bold rounded-2xl text-sm shadow-md transition ${t.mainBtn}`;
            document.getElementById('splitAddBtn').className = `text-xs px-3 py-1.5 rounded-xl text-white font-bold shadow-xs transition ${t.mainBtn}`;
            document.getElementById('splitSubmitBtn').className = `w-full py-3.5 rounded-2xl text-white font-bold shadow-md transition ${t.mainBtn}`;
            document.getElementById('catSubmitBtn').className = `w-full py-3 text-white font-bold rounded-xl text-sm shadow-md transition ${t.mainBtn}`;
        }

        function setTodayDate() {
            document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderApp();
            if (!document.getElementById('viewCharts').classList.contains('hidden')) renderChart();
        }

        // 展示櫃分類切換
        function filterPhotoCategory(type) {
            currentPhotoFilter = type;
            const t = themes[currentTheme] || themes.monet;
            ['all', 'expense', 'income'].forEach(k => {
                const btn = document.getElementById(`photoBtn${k.charAt(0).toUpperCase() + k.slice(1)}`);
                if (k === type) {
                    btn.className = `px-3 py-1 rounded-lg font-bold transition shadow-2xs text-white ${t.mainBtn}`;
                } else {
                    btn.className = 'px-3 py-1 rounded-lg font-medium transition text-gray-600 bg-transparent';
                }
            });
            renderPhotoGrid();
        }

        function renderPhotoGrid() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            const filtered = transactions.filter(t => {
                const d = new Date(t.date);
                const isMatchMonth = d.getFullYear() === year && (d.getMonth() + 1) === month;
                const hasPhoto = t.photo;
                const matchType = currentPhotoFilter === 'all' || t.type === currentPhotoFilter;
                return isMatchMonth && hasPhoto && matchType;
            });

            const photoGrid = document.getElementById('photoGrid');
            const noPhotosMsg = document.getElementById('noPhotosMsg');

            if (filtered.length === 0) {
                photoGrid.innerHTML = '';
                noPhotosMsg.classList.remove('hidden');
            } else {
                noPhotosMsg.classList.add('hidden');
                photoGrid.innerHTML = filtered.map(t => `
                    <div onclick="openDetailModal('${t.id}')" class="aspect-square bg-white rounded-2xl overflow-hidden storybook-card cursor-pointer hover:opacity-90 transition relative">
                        <img src="${t.photo}" class="w-full h-full object-cover">
                        <div class="absolute bottom-0 inset-x-0 bg-black/50 backdrop-blur-2xs text-white text-[10px] p-1.5 truncate text-center">${t.title}</div>
                    </div>
                `).join('');
            }
        }

        // 多人分帳功能
        function openSplitModal() {
            document.getElementById('splitForm').reset();
            document.getElementById('splitId').value = '';
            document.getElementById('splitModalTitle').innerText = '新增分帳項目';
            document.getElementById('splitCurrency').value = 'TWD';
            document.getElementById('splitConversionInfo').classList.add('hidden');
            document.getElementById('splitModal').classList.remove('hidden');
        }
        function closeSplitModal() { document.getElementById('splitModal').classList.add('hidden'); }

        function calculateSplitConverted() {
            const currency = document.getElementById('splitCurrency').value;
            const amountInput = parseFloat(document.getElementById('splitAmount').value) || 0;
            const infoBox = document.getElementById('splitConversionInfo');
            
            if (currency === 'TWD' || amountInput === 0) {
                infoBox.classList.add('hidden');
                return;
            }

            const rate = exchangeRates[currency] || 1;
            const converted = Math.round(amountInput * rate * 100) / 100;
            
            document.getElementById('splitRateText').innerText = `使用匯率 1 ${currency} ≈ ${rate} TWD`;
            document.getElementById('splitConvertedTwdText').innerText = `≈ NT$ ${converted.toLocaleString()}`;
            infoBox.classList.remove('hidden');
        }

        function handleSplitSubmit(e) {
            e.preventDefault();
            const currency = document.getElementById('splitCurrency').value;
            const rawAmount = parseFloat(document.getElementById('splitAmount').value);
            const title = document.getElementById('splitTitle').value;
            const payer = document.getElementById('splitPayer').value.trim();
            const membersInput = document.getElementById('splitMembers').value;
            const members = membersInput.split(',').map(m => m.trim()).filter(m => m);

            if (!rawAmount || !title || !payer || members.length === 0) {
                alert('請完整填寫分帳資訊！');
                return;
            }

            const rate = exchangeRates[currency] || 1;
            const amountTwd = Math.round(rawAmount * rate * 100) / 100;

            const id = document.getElementById('splitId').value || 'split_' + Date.now();
            const splitData = { id, title, currency, rawAmount, amountTwd, payer, members };

            const idx = splitItems.findIndex(s => s.id === id);
            if (idx >= 0) splitItems[idx] = splitData;
            else splitItems.unshift(splitData);

            localStorage.setItem('simple_account_splits', JSON.stringify(splitItems));
            renderSplitData();
            closeSplitModal();
        }

        function renderSplitData() {
            const itemList = document.getElementById('splitItemList');
            const summaryList = document.getElementById('splitSummaryList');

            if (splitItems.length === 0) {
                itemList.innerHTML = '<div class="text-xs text-gray-400 text-center py-4">目前沒有分帳紀錄喔！</div>';
                summaryList.innerHTML = '<div class="text-xs text-gray-400 text-center py-2">尚無成員結算資料</div>';
                return;
            }

            // 計算各成員墊付與應付金額
            const balances = {}; // { 成員名字: 淨額 (+表示別人欠他，-表示他欠別人) }
            const paidStats = {}; // 總代墊
            const shareStats = {}; // 應付總額

            splitItems.forEach(item => {
                const perShare = item.amountTwd / item.members.length;
                
                paidStats[item.payer] = (paidStats[item.payer] || 0) + item.amountTwd;

                item.members.forEach(m => {
                    shareStats[m] = (shareStats[m] || 0) + perShare;
                });
            });

            const allMembers = Array.from(new Set([...Object.keys(paidStats), ...Object.keys(shareStats)]));
            
            summaryList.innerHTML = allMembers.map(m => {
                const paid = paidStats[m] || 0;
                const share = shareStats[m] || 0;
                const diff = paid - share;
                const diffClass = diff >= 0 ? 'text-emerald-600' : 'text-rose-600';
                const diffText = diff >= 0 ? `可拿回 $${Math.round(diff).toLocaleString()}` : `需支付 $${Math.abs(Math.round(diff)).toLocaleString()}`;

                return `
                    <div class="flex justify-between items-center bg-gray-50 px-3 py-2.5 rounded-2xl border border-gray-100 text-xs">
                        <span class="font-bold text-gray-800">${m}</span>
                        <div class="text-right">
                            <span class="text-gray-400 mr-2">墊 $${Math.round(paid).toLocaleString()} / 應付 $${Math.round(share).toLocaleString()}</span>
                            <span class="font-bold ${diffClass}">${diffText}</span>
                        </div>
                    </div>
                `;
            }).join('');

            itemList.innerHTML = splitItems.map(item => `
                <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100 text-xs space-y-1">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-gray-800 text-sm">${item.title}</span>
                        <span class="font-bold text-gray-700">${item.currency !== 'TWD' ? `${item.currency} ${item.rawAmount} (NT$${item.amountTwd})` : `$${item.amountTwd}`}</span>
                    </div>
                    <div class="text-gray-400 flex justify-between">
                        <span>代墊：<strong class="text-gray-600">${item.payer}</strong> | 參與：${item.members.join(', ')}</span>
                        <button onclick="deleteSplit('${item.id}')" class="text-rose-500 hover:underline"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function deleteSplit(id) {
            if (confirm('確定刪除這筆分帳嗎？')) {
                splitItems = splitItems.filter(s => s.id !== id);
                localStorage.setItem('simple_account_splits', JSON.stringify(splitItems));
                renderSplitData();
            }
        }

        // 匯率設定
        function renderRateInputs() {
            const container = document.getElementById('rateInputsContainer');
            container.innerHTML = Object.keys(exchangeRates).map(curr => `
                <div class="flex items-center justify-between bg-gray-50 px-3 py-2.5 rounded-2xl border border-gray-100">
                    <span class="font-bold text-sm text-gray-700 w-16">${curr}</span>
                    <div class="flex items-center space-x-2">
                        <span class="text-xs text-gray-400">1 ${curr} =</span>
                        <input type="number" step="any" id="rate_${curr}" value="${exchangeRates[curr]}" class="w-24 px-3 py-1.5 bg-white rounded-xl border border-gray-200 text-right text-sm font-bold focus:outline-none focus:ring-1 focus:ring-emerald-400">
                        <span class="text-xs text-gray-400">TWD</span>
                    </div>
                </div>
            `).join('');
        }

        function saveCustomRates() {
            Object.keys(exchangeRates).forEach(curr => {
                const val = parseFloat(document.getElementById(`rate_${curr}`).value);
                if (!isNaN(val) && val > 0) exchangeRates[curr] = val;
            });
            localStorage.setItem('simple_account_rates', JSON.stringify(exchangeRates));
            alert('匯率設定已儲存成功！');
            switchView('overview');
            document.getElementById('viewSelect').value = 'overview';
        }

        function resetExchangeRates() {
            if (confirm('確定要恢復預設匯率嗎？')) {
                exchangeRates = { ...defaultExchangeRates };
                localStorage.setItem('simple_account_rates', JSON.stringify(exchangeRates));
                renderRateInputs();
                alert('已恢復預設匯率！');
            }
        }

        function calculateConvertedAmount() {
            const currency = document.getElementById('txCurrency').value;
            const amountInput = parseFloat(document.getElementById('txAmount').value) || 0;
            const infoBox = document.getElementById('conversionInfo');
            
            if (currency === 'TWD' || amountInput === 0) {
                infoBox.classList.add('hidden');
                return;
            }

            const rate = exchangeRates[currency] || 1;
            const converted = Math.round(amountInput * rate * 100) / 100;
            
            document.getElementById('exchangeRateText').innerText = `使用自訂匯率 1 ${currency} ≈ ${rate} TWD`;
            document.getElementById('convertedTwdText').innerText = `≈ NT$ ${converted.toLocaleString()}`;
            infoBox.classList.remove('hidden');
        }

        // 一般記帳功能
        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            container.innerHTML = '';
            const list = categories[currentType];
            list.forEach((cat, index) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `flex flex-col items-center justify-center p-2 rounded-2xl border border-gray-100 hover:bg-gray-50 category-btn ${index === 0 ? 'border-emerald-400 bg-emerald-50/50 ring-1 ring-emerald-400' : ''}`;
                btn.onclick = () => selectCategory(cat.id, btn);
                btn.innerHTML = `<div class="w-9 h-9 rounded-xl flex items-center justify-center ${cat.color} mb-1"><i class="fa-solid ${cat.icon}"></i></div><span class="text-[11px] text-gray-600 truncate w-full text-center">${cat.name}</span>`;
                container.appendChild(btn);
            });
            if (list.length > 0) document.getElementById('txCategory').value = list[0].id;
        }

        function selectCategory(catId, btnElement) {
            document.querySelectorAll('.category-btn').forEach(b => b.className = 'flex flex-col items-center justify-center p-2 rounded-2xl border border-gray-100 hover:bg-gray-50 category-btn');
            btnElement.className = 'flex flex-col items-center justify-center p-2 rounded-2xl border border-emerald-400 bg-emerald-50/50 ring-1 ring-emerald-400 category-btn';
            document.getElementById('txCategory').value = catId;
        }

        function switchType(type) {
            currentType = type;
            document.getElementById('typeExpenseBtn').className = type === 'expense' ? 'py-2.5 rounded-xl text-sm font-bold shadow-2xs bg-white text-rose-600' : 'py-2.5 rounded-xl text-sm font-bold text-gray-500';
            document.getElementById('typeIncomeBtn').className = type === 'income' ? 'py-2.5 rounded-xl text-sm font-bold shadow-2xs bg-white text-emerald-600' : 'py-2.5 rounded-xl text-sm font-bold text-gray-500';

        }

        function openAddCatModal() { document.getElementById('addCatModal').classList.remove('hidden'); }
        function closeAddCatModal() { document.getElementById('addCatModal').classList.add('hidden'); }

        function renderIconPicker() {
            const picker = document.getElementById('iconPicker');
            picker.innerHTML = availableIcons.map((ic, i) => `
                <div onclick="selectIcon('${ic}', this)" class="icon-opt p-2 rounded-xl text-center cursor-pointer hover:bg-gray-100 ${i === 0 ? 'bg-emerald-100 border border-emerald-400' : ''}">

                </div>
            `).join('');

        function selectIcon(iconClass, el) {
            document.querySelectorAll('.icon-opt').forEach(opt => opt.className = 'icon-opt p-2 rounded-xl text-center cursor-pointer hover:bg-gray-100');

        }

        function handleAddCategory(e) {
            e.preventDefault();
            const name = document.getElementById('newCatName').value;
            const icon = document.getElementById('selectedIcon').value;
            const newCat = { id: 'custom_' + Date.now(), name, icon, color: 'bg-indigo-100 text-indigo-600' };

            categories[currentType].push(newCat);
            localStorage.setItem('simple_account_cats', JSON.stringify(categories));
            renderCategories();
            closeAddCatModal();
            document.getElementById('newCatName').value = '';
        }

        function previewPhoto(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = true;
                submitBtn.innerText = '圖片處理中...';
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');

                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const MAX_WIDTH = 800, MAX_HEIGHT = 800;
                        let width = img.width, height = img.height;
                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        document.getElementById('photoPreviewImg').src = currentPhotoBase64;
                        document.getElementById('photoPreviewContainer').classList.remove('hidden');
                        document.getElementById('photoFileName').innerText = '已成功載入並壓縮照片';
                        document.getElementById('removePhotoBtn').classList.remove('hidden');

                        submitBtn.disabled = false;
                        submitBtn.innerText = '儲存紀錄';
                        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function clearPhoto() {
            currentPhotoBase64 = '';
            document.getElementById('txPhoto').value = '';
            document.getElementById('photoPreviewContainer').classList.add('hidden');
            document.getElementById('photoFileName').innerText = '選擇照片';
            document.getElementById('removePhotoBtn').classList.add('hidden');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const currency = document.getElementById('txCurrency').value;
            const rawAmount = parseFloat(document.getElementById('txAmount').value);
            const titleVal = document.getElementById('txTitle').value;
            const categoryVal = document.getElementById('txCategory').value;
            const dateVal = document.getElementById('txDate').value;

            if (!rawAmount || !titleVal || !categoryVal || !dateVal) { alert('請完整填寫欄位！'); return; }

            const rate = exchangeRates[currency] || 1;
            const finalTwdAmount = Math.round(rawAmount * rate * 100) / 100;

            const id = document.getElementById('txId').value || 'tx_' + Date.now();
            const txData = { id, type: currentType, currency, rawAmount, amount: finalTwdAmount, title: titleVal, category: categoryVal, date: dateVal, note: document.getElementById('txNote').value, photo: currentPhotoBase64 };

            const idx = transactions.findIndex(t => t.id === id);
            if (idx >= 0) transactions[idx] = txData;
            else transactions.unshift(txData);

            localStorage.setItem('simple_account_txs', JSON.stringify(transactions));
            renderApp();
            closeModal();
        }

        function createItemHtml(t) {
            const allCats = [...categories.expense, ...categories.income];
            const catObj = allCats.find(c => c.id === t.category) || { name: '其他', icon: 'fa-circle', color: 'bg-gray-100 text-gray-600' };
            const currencyText = (t.currency && t.currency !== 'TWD') ? `<span class="text-[10px] bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded mr-1">${t.currency} ${t.rawAmount}</span>` : '';

            return `
                <div onclick="openDetailModal('${t.id}')" class="bg-white/90 rounded-2xl p-3.5 storybook-card hover:shadow-md transition flex items-center justify-between cursor-pointer">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <div class="w-10 h-10 rounded-2xl flex items-center justify-center shrink-0 ${catObj.color}">
                            <i class="fa-solid ${catObj.icon}"></i>
                        </div>
                        <div class="truncate">
                            <div class="font-bold text-gray-800 text-sm truncate">${t.title}</div>
                            <div class="text-[11px] text-gray-400 flex items-center">${t.date}</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0 text-right">
                        <div>
                            ${currencyText}
                            <span class="font-bold text-sm ${t.type === 'income' ? 'text-emerald-600' : 'text-gray-800'}">
                                ${t.type === 'income' ? '+' : '-'}$${t.amount.toLocaleString()}
                            </span>
                        </div>
                        ${t.photo ? `<img src="${t.photo}" class="w-9 h-9 rounded-xl object-cover border border-gray-100 shadow-2xs">` : '<div class="w-9"></div>'}
                    </div>
                </div>
            `;
        }

        function renderApp() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            document.getElementById('currentMonthLabel').innerText = `${year}年 ${month}月`;

            const filtered = transactions.filter(t => {
                const d = new Date(t.date);
                return d.getFullYear() === year && (d.getMonth() + 1) === month;
            }).sort((a, b) => new Date(b.date) - new Date(a.date));

            let inc = 0, exp = 0;
            filtered.forEach(t => t.type === 'income' ? inc += t.amount : exp += t.amount);

            document.getElementById('overviewIncome').innerText = `$${inc.toLocaleString()}`;
            document.getElementById('overviewExpense').innerText = `$${exp.toLocaleString()}`;
            const bal = inc - exp;
            const balEl = document.getElementById('overviewBalance');
            balEl.innerText = `$${bal.toLocaleString()}`;
            balEl.className = `font-bold text-base ${bal >= 0 ? 'text-emerald-600' : 'text-rose-600'}`;
            document.getElementById('recordCount').innerText = `共 ${filtered.length} 筆`;

            document.getElementById('recentList').innerHTML = filtered.slice(0, 3).map(createItemHtml).join('');
            document.getElementById('fullList').innerHTML = filtered.map(createItemHtml).join('');
        }

        function openModal() {
            document.getElementById('txForm').reset();
            document.getElementById('txId').value = '';
            document.getElementById('modalTitle').innerText = '新增記帳';
            document.getElementById('txCurrency').value = 'TWD';
            document.getElementById('conversionInfo').classList.add('hidden');
            switchType('expense');
            setTodayDate();
            clearPhoto();
            document.getElementById('txModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('txModal').classList.add('hidden'); }

        function openDetailModal(id) {
            activeDetailId = id;
            const t = transactions.find(item => item.id === id);
            if (!t) return;

            const allCats = [...categories.expense, ...categories.income];
            const catObj = allCats.find(c => c.id === t.category) || { name: '其他', icon: 'fa-circle', color: 'bg-gray-100 text-gray-600' };

            document.getElementById('detailTitle').innerText = t.title;
            document.getElementById('detailCategory').innerText = catObj.name;
            document.getElementById('detailAmount').innerText = `${t.type === 'income' ? '+' : '-'}$${t.amount.toLocaleString()} 台幣`;
            document.getElementById('detailAmount').className = `font-bold ${t.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}`;

            const foreignRow = document.getElementById('detailForeignRow');
            if (t.currency && t.currency !== 'TWD') {
                document.getElementById('detailForeignAmount').innerText = `${t.currency} ${t.rawAmount.toLocaleString()}`;
                foreignRow.classList.remove('hidden');
            } else {
                foreignRow.classList.add('hidden');
            }

            document.getElementById('detailDate').innerText = t.date;
            document.getElementById('detailNote').innerText = t.note || '-';

            const iconEl = document.getElementById('detailIcon');
            iconEl.className = `w-10 h-10 rounded-2xl flex items-center justify-center text-white ${catObj.color}`;
            iconEl.innerHTML = `<i class="fa-solid ${catObj.icon}"></i>`;

            const photoSec = document.getElementById('detailPhotoSection');
            if (t.photo) {
                document.getElementById('detailPhotoImg').src = t.photo;
                photoSec.classList.remove('hidden');
            } else photoSec.classList.add('hidden');

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() { document.getElementById('detailModal').classList.add('hidden'); }

        function editCurrentTx() {
            const t = transactions.find(item => item.id === activeDetailId);
            if (!t) return;
            closeDetailModal();

            document.getElementById('txId').value = t.id;
            document.getElementById('modalTitle').innerText = '編輯記帳';
            switchType(t.type);
            document.getElementById('txCurrency').value = t.currency || 'TWD';
            document.getElementById('txAmount').value = t.rawAmount || t.amount;
            calculateConvertedAmount();
            document.getElementById('txTitle').value = t.title;
            document.getElementById('txDate').value = t.date;
            document.getElementById('txNote').value = t.note;

            if (t.photo) {
                currentPhotoBase64 = t.photo;
                document.getElementById('photoPreviewImg').src = t.photo;
                document.getElementById('photoPreviewContainer').classList.remove('hidden');
                document.getElementById('photoFileName').innerText = '已載入相片';
                document.getElementById('removePhotoBtn').classList.remove('hidden');
            } else clearPhoto();

            document.getElementById('txModal').classList.remove('hidden');
        }

        function deleteCurrentTx() {
            if (confirm('確定要刪除這筆紀錄嗎？')) {
                transactions = transactions.filter(item => item.id !== activeDetailId);
                localStorage.setItem('simple_account_txs', JSON.stringify(transactions));
                renderApp();
                closeDetailModal();
            }
        }

        function renderChart() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            const filtered = transactions.filter(t => {
                const d = new Date(t.date);
                return t.type === 'expense' && d.getFullYear() === year && (d.getMonth() + 1) === month;
            });

            const catTotals = {};
            categories.expense.forEach(c => catTotals[c.id] = 0);
            filtered.forEach(t => catTotals[t.category] = (catTotals[t.category] || 0) + t.amount);

            const labels = [];
            const data = [];
            categories.expense.forEach(c => {
                if (catTotals[c.id] > 0) {
                    labels.push(c.name);
                    data.push(catTotals[c.id]);
                }
            });

            const ctx = document.getElementById('expenseChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            if (data.length === 0) {
                ctx.clearRect(0, 0, 200, 200);
                return;
            }

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#E2D2D2', '#BFC8D7', '#E3E2B4', '#A2B59F', '#DAC2A5', '#C7CEEA', '#C9DECF', '#B97687'],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { 
                            position: 'bottom',
                            labels: { font: { family: 'LXGW WenKai TC' } }
                        } 
                    }
                }
            });
        }
    </script>
</body>
</html>
